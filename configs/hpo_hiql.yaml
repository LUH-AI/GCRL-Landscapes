defaults:
  - hydra/sweeper/search_space/hiql
  - hydra/sweeper/search_space/awr
  - smac
  - launcher
  - _self_
  - override hydra/sweeper: HyperSMAC
  - override hydra/launcher: submitit_slurm

agent_name: "hiql"
lr: 3e-4
batch_size: 1024
discount: 0.99
tau: 0.005
expectile: 0.7
low_alpha: 3.0
high_alpha: 3.0
subgoal_steps: 25
const_std: true
value_p_trajgoal: 0.5
value_p_curgoalshare: 0.4
value_geom_sample: true
actor_p_trajgoal: 1.0
actor_p_curgoalshare: 1.0
actor_geom_sample: false
actor_loss: "awr"

seed: 0
training_steps: 200000
