hyperparameters:
  lr:
    type: uniform_float
    lower: 1e-6
    upper: 1.0
    default_value: 3e-4
    log: true
  discount:
    type: uniform_float
    lower: 0.8
    upper: 0.9999
    default_value: 0.995
  actor_p_trajgoal:
    type: uniform_float
    lower: 0.0
    upper: 1.0
    default_value: 1.0
  actor_p_curgoalshare:
    type: uniform_float
    lower: 0.0
    upper: 1.0
    default_value: 0.0
