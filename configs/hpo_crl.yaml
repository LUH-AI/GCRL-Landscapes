defaults:
  - hydra/sweeper/search_space/crl
  - hydra/sweeper/search_space/awr
  - smac
  - launcher
  - _self_
  - override hydra/sweeper: HyperSMAC
  - override hydra/launcher: submitit_slurm

agent_name: "crl"
lr: 3e-4
batch_size: 1024
latent_dim: 512
discount: 0.99
const_std: true
value_geom_sample: true
actor_p_trajgoal: 1.0
actor_p_curgoalshare: 1.0
actor_geom_sample: false
alpha: 0.0
actor_loss: "awr"

seed: 0
training_steps: 1000000
