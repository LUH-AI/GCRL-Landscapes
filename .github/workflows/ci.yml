name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint and tests (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install linter
        # Fast, isolated step so that lint results are reported even if the
        # package install below fails.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.12.5"

      - name: Ruff
        run: ruff check src tests analysis paper-metrics/scripts

      # NOTE: `ruff format --check` is deliberately not enforced yet. The tree is
      # not fully ruff-formatted (about 20 files), so the gate would always fail.
      # Enable it once formatting is applied repository-wide.

      - name: Install package
        # NOTE: the runtime dependency set is heavy (JAX with CUDA wheels,
        # TensorFlow, GPFlow, SMAC, OGBench). It installs and runs on a CPU-only
        # runner, but takes several minutes. CPU-only is sufficient: the tests do
        # not need a GPU.
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q
