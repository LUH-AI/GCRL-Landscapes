name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff>=0.12.5"

      - name: Ruff
        run: ruff check src tests analysis paper-metrics/scripts

      # NOTE: `ruff format --check` is deliberately not enforced yet. About 20
      # files are not ruff-formatted, so the gate would always fail. Enable it
      # once formatting has been applied repository-wide.

  test:
    name: Tests (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package
        # NOTE: the runtime dependency set is heavy (JAX with CUDA wheels,
        # TensorFlow, GPFlow, SMAC, OGBench), so this step takes a few minutes.
        # It runs CPU-only, which is enough: the tests do not need a GPU.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q
