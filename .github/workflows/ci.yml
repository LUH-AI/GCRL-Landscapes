name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uvx runs ruff in an isolated environment, so the heavy runtime
      # dependency set is not installed for the lint job.
      - uses: astral-sh/setup-uv@v5

      - name: Ruff
        run: uvx ruff@0.12.12 check src tests analysis paper-metrics/scripts

      # NOTE: `ruff format --check` is deliberately not enforced yet. About 20
      # files are not ruff-formatted, so the gate would always fail. Enable it
      # once formatting has been applied repository-wide.

  test:
    name: Tests (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv sync honours uv.lock and [tool.uv.sources], which pins ogbench to
      # CrunchyFlakes/ogbench@master and smac to automl/SMAC3@v2.4.0. A plain
      # `pip install -e ".[dev]"` silently ignores those sources.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install package
        # NOTE: the runtime dependency set is heavy (JAX with CUDA wheels,
        # TensorFlow, GPFlow, SMAC, OGBench), so this step takes a few minutes.
        # It runs CPU-only, which is enough: the tests do not need a GPU.
        run: uv sync --extra dev

      - name: Tests
        run: uv run pytest -q
